version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    EKS_CLUSTER_NAME: "todo-react-eks"
    K8S_NAMESPACE: "default"
    K8S_DEPLOYMENT_NAME: "todo-react"
    K8S_CONTAINER_NAME: "todo-react"
    K8S_SERVICE_NAME: "todo-react-service"

phases:
  install:
    commands:
      - 'echo "Deploy phase started on $(date)"'
      - aws --version
      - kubectl version --client

  pre_build:
    commands:
      - 'echo "Reading image metadata from previous stage..."'
      - export IMAGE_URI=$(python3 -c "import json; print(json.load(open('imageDetail.json'))['ImageURI'])")
      - 'echo "Image to deploy: $IMAGE_URI"'
      - 'echo "Updating kubeconfig for EKS..."'
      - aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_DEFAULT_REGION
      - kubectl get nodes
      - kubectl get ns

  build:
    commands:
      - 'echo "Applying service manifest..."'
      - kubectl apply -f k8s/service.yaml -n $K8S_NAMESPACE
      - 'echo "Applying deployment manifest..."'
      - kubectl apply -f k8s/deployment.yaml -n $K8S_NAMESPACE
      - 'echo "Updating deployment image..."'
      - kubectl set image deployment/$K8S_DEPLOYMENT_NAME $K8S_CONTAINER_NAME=$IMAGE_URI -n $K8S_NAMESPACE
      - 'echo "Checking rollout status..."'
      - kubectl rollout status deployment/$K8S_DEPLOYMENT_NAME -n $K8S_NAMESPACE --timeout=300s

  post_build:
    commands:
      - 'echo "Deployment verification..."'
      - kubectl get deployment $K8S_DEPLOYMENT_NAME -n $K8S_NAMESPACE
      - kubectl get pods -n $K8S_NAMESPACE -o wide
      - kubectl get svc $K8S_SERVICE_NAME -n $K8S_NAMESPACE
