version: 0.2

env:
  variables:
    CI: "true"
    NODE_OPTIONS: "--max-old-space-size=2048"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Install phase started on $(date)"
      - node -v
      - npm -v
      - npm ci

  pre_build:
    commands:
      - echo "Running lint checks..."
      - npm run lint

  build:
    on-failure: ABORT
    commands:
      - echo "Running unit tests..."
      - npm run test
      - echo "Running production build validation..."
      - npm run build

artifacts:
  files:
    - dist/**/*
    - package.json
    - package-lock.json
    - vite.config.*
    - src/**/*
    - public/**/*
    - k8s/**/*
  discard-paths: no

cache:
  paths:
    - '/root/.npm/**/*'