version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    TRIVY_VERSION: "0.51.2"
    FAIL_SEVERITIES: "HIGH,CRITICAL"

phases:
  install:
    commands:
      - 'echo "Scan phase started on $(date)"'
      - aws --version
      - docker version

  pre_build:
    commands:
      - 'echo "Reading image metadata..."'
      - export IMAGE_URI=$(python3 -c "import json; print(json.load(open('imageDetail.json'))['ImageURI'])")
      - 'echo "Image to scan: $IMAGE_URI"'
      - docker pull aquasec/trivy:${TRIVY_VERSION}

  build:
    commands:
      - 'echo "Running Trivy scan in container..."'
      - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /root/.cache:/root/.cache aquasec/trivy:${TRIVY_VERSION} image --no-progress --exit-code 1 --severity ${FAIL_SEVERITIES} "$IMAGE_URI"

  post_build:
    commands:
      - 'echo "Trivy scan completed on $(date)"'

artifacts:
  files:
    - imageDetail.json
    - buildspec-deploy.yml
    - k8s/**/*
  discard-paths: no
