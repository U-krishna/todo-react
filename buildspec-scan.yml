version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    TRIVY_VERSION: "0.51.2"
    FAIL_SEVERITIES: "HIGH,CRITICAL"

phases:
  install:
    commands:
      - 'echo "Scan phase started on $(date)"'
      - aws --version
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
      - trivy --version

  pre_build:
    commands:
      - 'echo "Reading image metadata..."'
      - export IMAGE_URI=$(python3 -c "import json; print(json.load(open('imageDetail.json'))['ImageURI'])")
      - 'echo "Image to scan: $IMAGE_URI"'

  build:
    commands:
      - 'echo "Running Trivy scan..."'
      - trivy image --no-progress --exit-code 1 --severity ${FAIL_SEVERITIES} "$IMAGE_URI"

  post_build:
    commands:
      - 'echo "Trivy scan completed on $(date)"'

artifacts:
  files:
    - imageDetail.json
    - buildspec-deploy.yml
    - k8s/**/*
  discard-paths: no
