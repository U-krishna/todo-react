apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-react
  template:
    metadata:
      labels:
        app: todo-react
    spec:
      containers:
        - name: todo-react
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80