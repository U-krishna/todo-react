apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-react
  labels:
    app: todo-react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-react
  template:
    metadata:
      labels:
        app: todo-react
    spec:
      containers:
        - name: todo-react
          image: 022112164130.dkr.ecr.us-east-1.amazonaws.com/todo-react:latest
          ports:
            - containerPort: 80