version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    AWS_ACCOUNT_ID: "022112164130"
    IMAGE_REPO_NAME: "todo-react"

phases:
  install:
    commands:
      - 'echo "Build phase started on $(date)"'
      - aws --version
      - docker version
      - export REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - export COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - export IMAGE_TAG=${COMMIT_HASH:=latest}
      - 'echo "Repository URI: $REPOSITORY_URI"'
      - 'echo "Image tag: $IMAGE_TAG"'

  pre_build:
    commands:
      - 'echo "Logging in to Amazon ECR..."'
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      - 'echo "Ensuring repository exists..."'
      - aws ecr describe-repositories --repository-names $IMAGE_REPO_NAME --region $AWS_DEFAULT_REGION || aws ecr create-repository --repository-name $IMAGE_REPO_NAME --region $AWS_DEFAULT_REGION
      - 'echo "Preparing Docker buildx..."'
      - docker buildx create --use --name cbuilder || true
      - docker buildx inspect --bootstrap

  build:
    commands:
      - 'echo "Building and pushing linux/amd64 image..."'
      - docker buildx build --platform linux/amd64 --tag $REPOSITORY_URI:$IMAGE_TAG --tag $REPOSITORY_URI:latest --push .

  post_build:
    commands:
      - 'echo "Build completed on $(date)"'
      - 'echo "Generating deployment metadata..."'
      - printf '{"ImageURI":"%s","ImageTag":"%s","RepositoryURI":"%s"}' "$REPOSITORY_URI:$IMAGE_TAG" "$IMAGE_TAG" "$REPOSITORY_URI" > imageDetail.json
      - cat imageDetail.json

artifacts:
  files:
    - imageDetail.json
    - k8s/**/*
  discard-paths: no

cache:
  paths:
    - '/root/.cache/**/*'