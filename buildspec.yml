version: 0.2

phases:
  install:
    commands:
      - echo "Installing Node.js 20..."
      - curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
      - yum install -y nodejs
      - echo "Node version:$(node -v)"
      - echo "NPM version:$(npm -v)"

  build:
    commands:
      - echo "Installing dependencies..."
      - npm install
      - echo "Building..."
      - npm run build

  post_build:
    commands:
      - echo "Build successful!"

artifacts:
  files:
    - '**/*'
  base-directory: dist